name: Erlang CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

# Top-level permissions for whole workflow (needed by Pages actions)
permissions:
  contents: read
  pages: write
  id-token: write

# Ensure only one Pages deployment runs at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  REBAR3_VERSION: '3.23.0'
  CONTAINER_REBAR3_VERSION: '3.28.0'
  # OTP version to use for coverage and docs publishing
  COVERAGE_OTP: '26'

jobs:
  test:
    name: OTP ${{ matrix.otp }} – Ubuntu
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # setup-beam's Ubuntu 26.04 builds start at OTP 26.
        otp: [26, 27, 28, 29]
        include:
          - otp: 28
            rebar3: '3.x'
          - otp: 29
            rebar3: '3.x'

    services: &test-services
      couchdb:
        image: couchdb:3
        ports:
          - 5984:5984
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: admin
        options: >-
          --name couchdb
          --health-cmd "curl -f http://localhost:5984/_up || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      influxdb:
        image: influxdb:2.0
        ports:
          - 8086:8086
        env:
          DOCKER_INFLUXDB_INIT_MODE: setup
          DOCKER_INFLUXDB_INIT_USERNAME: default
          DOCKER_INFLUXDB_INIT_PASSWORD: defaultpassword
          DOCKER_INFLUXDB_INIT_ORG: default
          DOCKER_INFLUXDB_INIT_BUCKET: sandbox
          DOCKER_INFLUXDB_INIT_RETENTION: 1h
          DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: admintoken
        options: >-
          --name influxdb
          --health-cmd "curl -f http://localhost:8086/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      COUCHDB_URL: http://admin:admin@localhost:5984
      INFLUXDB_URL: http://localhost:8086
      INFLUXDB_TOKEN: admintoken

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Erlang/OTP ${{ matrix.otp }}
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: ${{ matrix.rebar3 || env.REBAR3_VERSION }}

      - name: Cache rebar3 deps & build
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-rebar3-${{ matrix.otp }}-${{ hashFiles('rebar.config', 'rebar.lock', 'src/**/*.erl') }}
          restore-keys: |
            ${{ runner.os }}-rebar3-${{ matrix.otp }}-

      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap uidmap
          bwrap --version
          ls -la "$(command -v bwrap)"

      - name: Enable unprivileged user namespaces (for bwrap)
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          sudo sysctl -w user.max_user_namespaces=28633
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Verify bwrap can run
        run: |
          bwrap --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp -- /bin/true

      - name: Make test script executable
        run: chmod +x ./run_test.sh

      - name: Wait for CouchDB to be ready
        run: |
          echo "Waiting for CouchDB to be healthy..."
          for i in {1..30}; do
            if curl -fs http://admin:admin@localhost:5984/_up >/dev/null; then
              echo "CouchDB is up!" && break
            fi
            sleep 2
          done
          if ! curl -fs http://admin:admin@localhost:5984/_up >/dev/null; then
            echo "CouchDB failed to become healthy after 60 s" >&2
            exit 1
          fi

      - name: Wait for InfluxDB to be healthy
        run: |
          echo "Waiting for InfluxDB to be healthy..."
          for i in {1..30}; do
            if curl -fs http://localhost:8086/health >/dev/null; then
              echo "InfluxDB is up!" && break
            fi
            sleep 2
          done
          if ! curl -fs http://localhost:8086/health >/dev/null; then
            echo "InfluxDB failed to become healthy after 60 s" >&2
            exit 1
          fi

      - name: Run test suite
        run: ./run_test.sh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-otp-${{ matrix.otp }}
          path: _build/test/cover

  debian:
    name: Debian ${{ matrix.os_version }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Change the distribution and OTP versions here.
        os_version: ['13']
        otp: ['28.5.0.8']
    container:
      image: debian:${{ matrix.os_version }}
      options: --privileged
    defaults: &container-defaults
      run:
        shell: bash
    services: *test-services
    env: &container-test-env
      OTP_VERSION: ${{ matrix.otp }}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      ERL_FLAGS: '+S 2 +sbwt none +sbwtdcpu none +sbwtdio none'
      COUCHDB_URL: http://admin:admin@couchdb:5984
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: admintoken
    steps: &container-test-steps
      - name: Install CI dependencies
        run: |
          . /etc/os-release
          case "$ID" in
            debian)
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                --no-install-recommends build-essential autoconf m4 perl \
                libncurses-dev libssl-dev git curl ca-certificates \
                bubblewrap procps util-linux passwd
              ;;
            almalinux)
              dnf install -y gcc gcc-c++ make autoconf m4 perl \
                ncurses-devel openssl-devel git curl-minimal \
                ca-certificates tar gzip bubblewrap procps-ng util-linux
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Erlang/OTP
        id: otp-cache
        uses: actions/cache@v4
        with:
          path: /opt/otp
          key: >-
            otp-${{ runner.arch }}-${{ github.job }}-${{
            matrix.os_version }}-${{ matrix.otp }}-${{
            hashFiles('.github/workflows/erlang-tests.yml') }}

      - name: Build Erlang/OTP ${{ matrix.otp }}
        if: steps.otp-cache.outputs.cache-hit != 'true'
        run: |
          release="https://github.com/erlang/otp/releases/download"
          archive="otp_src_${OTP_VERSION}.tar.gz"
          curl -fL --retry 3 "$release/OTP-$OTP_VERSION/$archive" \
            -o "$RUNNER_TEMP/$archive"
          mkdir -p "$RUNNER_TEMP/otp-source"
          tar -xzf "$RUNNER_TEMP/$archive" --strip-components=1 \
            -C "$RUNNER_TEMP/otp-source"
          cd "$RUNNER_TEMP/otp-source"
          ./configure --prefix=/opt/otp \
            --without-javac --without-wx --without-odbc
          make -j2
          make install

      - name: Set up Erlang and rebar3
        run: |
          echo /opt/otp/bin >> "$GITHUB_PATH"
          release="https://github.com/erlang/rebar3/releases/download"
          curl -fL --retry 3 \
            "$release/$CONTAINER_REBAR3_VERSION/rebar3" \
            -o /usr/local/bin/rebar3
          chmod +x /usr/local/bin/rebar3

      - name: Prepare unprivileged tests
        run: |
          useradd --create-home --shell /bin/bash ci
          chown -R ci:ci "$GITHUB_WORKSPACE"
          sysctl -w user.max_user_namespaces=28633
          if test -f /proc/sys/kernel/unprivileged_userns_clone; then
            sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if test -f \
            /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          runuser -u ci -- bwrap --ro-bind / / --dev /dev --proc /proc \
            --tmpfs /tmp -- /bin/true

      - name: Run test suite
        run: runuser -u ci -- bash ./run_test.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: >-
            reports-${{ github.job }}-${{ matrix.os_version }}-${{ matrix.otp }}
          path: |
            _build/test/logs
            _build/test/cover

  alma:
    name: AlmaLinux ${{ matrix.os_version }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Change the distribution and OTP versions here.
        os_version: ['9']
        otp: ['28.5.0.8']
    container:
      image: almalinux:${{ matrix.os_version }}
      options: --privileged
    defaults: *container-defaults
    services: *test-services
    env: *container-test-env
    steps: *container-test-steps

  # ---------------------------------------------------------
  # Build and publish the edoc
  # Publish the coverage report from OTP ${{ env.COVERAGE_OTP }} run to GitHub Pages
  publish-html:
    needs: [test, debian, alma]
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Build HTML API docs and place them under public/edoc so that
      # the coverage report (index.html at the root) remains
      # the entry-point of the site.
      - name: Checkout repository (for docs)
        uses: actions/checkout@v4

      - name: Set up Erlang/OTP (for docs)
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.COVERAGE_OTP }}
          rebar3-version: ${{ env.REBAR3_VERSION }}

      - name: Generate EDoc documentation
        run: |
          rebar3 edoc
          mkdir -p public/edoc
          cp -r doc/* public/edoc/

      # Strip absolute build path prefixes inside generated HTML so
      # internal links are relative (remove ".../doc/")
      - name: Make EDoc links relative
        run: |
          DOC_PREFIX=$(pwd | sed 's|$|/doc/|')
          find public/edoc -type f -name '*.html' -print0 |\
            xargs -0 sed -i -e "s|$DOC_PREFIX||g"

      - name: Download coverage artifact (OTP ${{ env.COVERAGE_OTP }})
        uses: actions/download-artifact@v4
        with:
          name: coverage-otp-${{ env.COVERAGE_OTP }}
          path: public/cover

      # Create a simple landing page that links to both reports
      - name: Create landing page
        run: |
          cat > public/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Documentation & reports</title>
          </head>
          <body>
            <h1>Generated documentation and reports</h1>
            <ul>
              <li><a href="cover/index.html">Coverage report</a></li>
              <li><a href="edoc/index.html">API docs (EDoc)</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Upload the files as a Pages artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
